# SCR nginx main config - v0.1.0 (Phase 0)
# Copy to C:\nginx\conf\nginx.conf. Site configs are loaded straight from the repo at C:\scr.

worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    keepalive_timeout   65;
    server_tokens       off;
    access_log          logs/access.log;

    # 100 MB uploads + encryption overhead
    client_max_body_size 110m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include C:/scr/infra/nginx/sites/*.conf;
}
