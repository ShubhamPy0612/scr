# SCR nginx bootstrap config - v0.1.0 (Phase 0)
# HTTP only, used once to obtain the first TLS certificate. Copy to C:\nginx\conf\nginx-bootstrap.conf.

worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    include C:/scr/infra/nginx/sites/00-http.conf;
}
