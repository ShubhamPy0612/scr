# SCR TLS settings - v0.1.0 (Phase 0). One SAN certificate covers all three hostnames.
ssl_certificate      C:/certs/scr-chain.pem;
ssl_certificate_key  C:/certs/scr-key.pem;

ssl_protocols        TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_session_cache    shared:SSL:10m;
ssl_session_timeout  1d;
ssl_session_tickets  off;
