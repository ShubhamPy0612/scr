# SCR TLS settings - v0.2.0 (Phase 0). One SAN certificate covers all three hostnames.
ssl_certificate      C:/krm_doc/nginx-1.30.3/certs/scr-chain.pem;
ssl_certificate_key  C:/krm_doc/nginx-1.30.3/certs/scr-key.pem;

ssl_protocols        TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# Own zone name so it can't clash with a cache defined by other sites
ssl_session_cache    shared:SCR_SSL:10m;
ssl_session_timeout  1d;
ssl_session_tickets  off;
