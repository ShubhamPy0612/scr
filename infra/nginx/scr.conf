# SCR nginx drop-in - v0.3.0 (Phase 0)
#
# Loaded by ONE line inside the http { } block of your existing nginx.conf:
#     include C:/scr/infra/nginx/scr.conf;
#
# Safe to share an nginx with other apps:
#   - only matches p2p / rtc / turn .p2p.testerapp.in, never default_server
#   - all names it defines are SCR-prefixed ($scr_connection_upgrade, SCR_SSL zone)
#   - no http-level settings that would change other sites

map $http_upgrade $scr_connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: redirect to HTTPS only. Certificates are issued elsewhere and copied in manually.
server {
    listen 80;
    server_name p2p.testerapp.in rtc.p2p.testerapp.in turn.p2p.testerapp.in;
    return 301 https://$host$request_uri;
}

# Main app: web UI + API + chat WebSocket
server {
    listen 443 ssl;
    http2 on;
    server_name p2p.testerapp.in;

    include C:/scr/infra/nginx/snippets/ssl.conf;
    include C:/scr/infra/nginx/snippets/security-headers.conf;

    # 100 MB uploads + encryption overhead
    client_max_body_size 110m;

    # Phase 1 switches this to the built web app
    root C:/scr/infra/nginx/placeholder;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend (Phase 1) - 502 until then
    location /api/ {
        include C:/scr/infra/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location = /ws {
        include C:/scr/infra/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# LiveKit signaling (Phase 4) - 502 until then, except /healthz
server {
    listen 443 ssl;
    http2 on;
    server_name rtc.p2p.testerapp.in;

    include C:/scr/infra/nginx/snippets/ssl.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include C:/scr/infra/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:7880;
    }
}

# turn.* is served by LiveKit's own TURN/TLS on 5349; nothing on 443
server {
    listen 443 ssl;
    http2 on;
    server_name turn.p2p.testerapp.in;

    include C:/scr/infra/nginx/snippets/ssl.conf;
    return 444;
}
