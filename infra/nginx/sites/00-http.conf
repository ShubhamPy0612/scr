# SCR port 80 - v0.1.0 (Phase 0): ACME challenges + redirect to HTTPS

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name p2p.testerapp.in rtc.p2p.testerapp.in turn.p2p.testerapp.in;

    location ^~ /.well-known/acme-challenge/ {
        root C:/nginx/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
