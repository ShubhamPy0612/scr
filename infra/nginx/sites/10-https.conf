# SCR port 443 - v0.1.0 (Phase 0)

# Unknown hostnames (incl. turn.*, whose TLS is served by LiveKit on 5349): drop
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    include C:/scr/infra/nginx/snippets/ssl.conf;
    return 444;
}

# Main app: web UI + API + chat WebSocket
server {
    listen 443 ssl;
    http2 on;
    server_name p2p.testerapp.in;

    include C:/scr/infra/nginx/snippets/ssl.conf;
    include C:/scr/infra/nginx/snippets/security-headers.conf;

    # Phase 1 switches this to the built web app
    root C:/scr/infra/nginx/placeholder;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend (Phase 1) - 502 until then
    location /api/ {
        include C:/scr/infra/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location = /ws {
        include C:/scr/infra/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# LiveKit signaling (Phase 4) - 502 until then, except /healthz
server {
    listen 443 ssl;
    http2 on;
    server_name rtc.p2p.testerapp.in;

    include C:/scr/infra/nginx/snippets/ssl.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include C:/scr/infra/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:7880;
    }
}
